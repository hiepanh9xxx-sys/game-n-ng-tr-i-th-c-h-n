<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f5420">
<meta name="description" content="Nông Trại Ngọc Ánh – game nông trại pixel. Chương 1: Trở về Thác Hàn.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ngọc Ánh">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;overscroll-behavior:none}
[hidden]{display:none!important}
body{position:fixed;inset:0;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);-webkit-touch-callout:none;-webkit-user-select:none}
</style>
<title>Thác Hàn Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: full-screen isometric canvas; soft rounded cream HUD cards float over it (quest top-left, clock + family top-right, hotbar bottom). Cozy hand-drawn countryside look: warm cream, wood brown, leaf green, sky blue, sun yellow. */
:root{
  color-scheme: light;
  --ground:#5c9842;
  --parch:#fff7e3; --parch2:#fde9bf;
  --wood:#c98a4e; --wood-dark:#8a5a36; --wood-light:#e8b47a;
  --ink:#5a3a24; --muted:#9a7656;
  --gold:#f2b632; --energy:#5cc84a; --energy-low:#e2553b; --water:#4a9ad9;
  --font:"Baloo 2","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
#game{position:relative;height:100%;width:100%;overflow:hidden}
canvas#view{display:block;width:100%;height:100%}

.box{background:var(--parch);border:3px solid var(--wood-dark);box-shadow:inset 0 0 0 2px var(--parch2),0 4px 0 rgba(90,55,30,.35),0 8px 18px rgba(40,60,20,.18);border-radius:18px}
.hud{position:absolute;z-index:3;pointer-events:none}
.hud .box{pointer-events:auto}

/* Quest */
#quest{left:10px;top:10px;max-width:min(360px,calc(100% - 200px));min-width:0}
#quest .box{padding:6px 12px 8px}
#quest .eye{font-size:14px;color:var(--muted);line-height:1.1}
#quest .t{font-size:20px;line-height:1.1;color:#4f8a2e;font-weight:800}
#quest .d{font-size:15px;line-height:1.25;font-weight:600}
#quest .p{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:16px;font-variant-numeric:tabular-nums}
#quest .bar{flex:1;height:10px;background:#f1dcae;border:2px solid var(--wood-dark);border-radius:999px;overflow:hidden}
#quest .bar i{display:block;height:100%;background:linear-gradient(#ffe27a,#f6b93b);width:0;border-radius:999px}

/* Clock + family */
#right{right:10px;top:10px;display:grid;gap:6px;justify-items:end}
#clock{padding:4px 10px;display:grid;grid-template-columns:auto auto;column-gap:10px;align-items:center;font-variant-numeric:tabular-nums}
#clock .day{font-size:17px}
#clock .time{font-size:24px;line-height:1;text-align:right;font-weight:800;color:#4a7fbf}
#clock .wx{font-size:15px;color:var(--muted)}
#clock .gold{font-size:18px;text-align:right;color:#8a5a00}
#family{display:grid;gap:4px}
.fm{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:16px;cursor:pointer;font-family:var(--font);font-size:16px;color:var(--ink);text-align:left}
.fm.on{background:#fff4c4;border-color:#b07a0a;box-shadow:inset 0 0 0 2px #ffe27a,0 3px 0 rgba(0,0,0,.35)}
.fm img{width:34px;height:34px;border-radius:50%;background:#d9f0e4}
.fm .en{width:64px;height:8px;background:#f1dcae;border:1.5px solid var(--wood-dark);border-radius:999px;overflow:hidden;display:block;margin-top:2px}
.fm .en i{display:block;height:100%;background:var(--energy);border-radius:999px}
.fm .en.low i{background:var(--energy-low)}
.fm .nm{line-height:1}

/* Hotbar */
#hotbar{left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:3px;padding:4px}
.slot{position:relative;width:48px;height:48px;background:#fdecc4;border:2px solid #d8b27a;border-radius:14px;display:grid;place-items:center;cursor:pointer;padding:0}
.slot.on{border-color:#f08a3a;box-shadow:0 0 0 3px #ffd166;background:#fff6d8}
.slot img{width:36px;height:36px}
.slot .n{position:absolute;right:3px;bottom:-3px;font-size:15px;font-weight:800;color:#fff;text-shadow:1px 1px 0 #8a5a36,-1px -1px 0 #8a5a36,1px -1px 0 #8a5a36,-1px 1px 0 #8a5a36;font-variant-numeric:tabular-nums}
.slot .k{position:absolute;left:3px;top:0;font-size:12px;color:var(--muted)}
#itemname{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);z-index:3;padding:0 12px;font-size:15px;font-weight:700;white-space:nowrap}

/* Touch controls */
#touch{display:none}
@media (pointer:coarse){#touch{display:block}}
.dpad{position:absolute;left:12px;bottom:72px;width:132px;height:132px;z-index:4}
.dpad button,.abtn{position:absolute;background:rgba(246,227,180,.85);border:3px solid var(--wood-dark);color:var(--wood-dark);font-family:var(--font);font-size:22px;border-radius:10px;width:44px;height:44px;padding:0;touch-action:none}
.dpad .u{left:44px;top:0}.dpad .d{left:44px;bottom:0}.dpad .l{left:0;top:44px}.dpad .r{right:0;top:44px}
.abtns{position:absolute;right:12px;bottom:76px;width:130px;height:120px;z-index:4}
.abtn.a{width:64px;height:64px;border-radius:50%;right:0;bottom:0;font-size:20px;background:rgba(242,182,50,.92)}
.abtn.b{right:70px;bottom:6px;width:52px;height:52px;border-radius:50%;font-size:15px}
.abtn.m{right:6px;bottom:72px;width:52px;height:40px;font-size:16px}
#menuBtn{position:absolute;left:10px;bottom:10px;z-index:3;font-family:var(--font);font-size:17px;font-weight:700;color:var(--ink);padding:4px 16px;cursor:pointer}


/* Toast */
#toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);z-index:6;padding:4px 16px;font-size:17px;font-weight:700;max-width:86%;text-align:center}

/* Dialogue */
#dlg{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);width:min(760px,calc(100% - 24px));z-index:8;display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 16px;cursor:pointer}
#dlg.narr{grid-template-columns:1fr}
#dlg .pt{width:96px;height:104px;background:linear-gradient(#cfeefc,#e4f5d6);border:3px solid var(--wood-dark);border-radius:20px;display:grid;place-items:end center;overflow:hidden}
#dlg .pt img{width:92px;height:99px}
#dlg .who{display:inline-block;background:#7cc95a;color:#fff;padding:0 12px;border-radius:999px;font-size:17px;font-weight:700}
#dlg p{margin:4px 0 0;font-size:20px;line-height:1.35;min-height:2.6em;font-weight:600}
#dlg.narr p{font-style:italic}
#dlg .nx{position:absolute;right:12px;bottom:4px;font-size:14px;color:var(--muted)}

/* Modals */
.scrim{position:absolute;inset:0;z-index:10;background:rgba(10,14,8,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.panel{box-sizing:border-box;width:min(520px,100%);padding:16px 18px;display:grid;gap:12px}
.panel h2{margin:0;font-size:28px;line-height:1.1;color:#4f8a2e;font-weight:800}
.panel p{margin:0;font-size:19px;line-height:1.3}
.btn{font-family:var(--font);font-size:18px;font-weight:700;color:#fff;background:var(--wood);border:3px solid var(--wood-dark);border-radius:999px;padding:4px 18px;cursor:pointer;box-shadow:inset 0 2px 0 var(--wood-light),0 3px 0 var(--wood-dark)}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 2px 0 var(--wood-light)}
.btn.gold{background:#7cc95a;border-color:#4f8a2e;color:#fff;box-shadow:inset 0 2px 0 #a6e283,0 3px 0 #4f8a2e}
.btn.red{background:#b8432e;border-color:#6e2214;box-shadow:inset 0 2px 0 #e07a62,0 3px 0 #6e2214}
.btn:focus-visible,.slot:focus-visible,.fm:focus-visible,#dlg:focus-visible{outline:3px solid #fff;outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.col{display:grid;gap:8px}
.saves{display:grid;gap:8px}
.save{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#fffdf4;border:2px solid #e3c48e;border-radius:16px;padding:8px 10px}
.save b{font-weight:800;font-size:19px;color:var(--wood-dark)}
.save small{display:block;font-size:16px;color:var(--muted);line-height:1.2}
.save .row{justify-content:flex-end}
textarea,input[type=text]{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;width:100%;box-sizing:border-box;border:2px solid var(--wood-dark);border-radius:14px;background:#fffdf6;color:var(--ink);padding:10px}
input[type=text]{font-family:var(--font);font-size:22px}
textarea{height:120px;resize:vertical;user-select:text}
.keys{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:18px}
.keys kbd{font-family:var(--font);font-weight:700;background:#fffdf4;border:2px solid #e3c48e;border-radius:10px;padding:0 6px;justify-self:start}

/* Title */
#title{position:absolute;inset:0;z-index:12;display:grid;place-items:center;padding:16px;overflow:auto;background:radial-gradient(ellipse 120% 60% at 50% 100%,#8ccb5a 0 55%,transparent 56%),radial-gradient(ellipse 80% 40% at 15% 92%,#6fae44 0 60%,transparent 61%),linear-gradient(#8fd3f4 0%,#d5f0fb 60%,#fff3d6 100%)}
#title .logo{font-size:clamp(40px,9vw,72px);line-height:.95;color:#fff7e3;-webkit-text-stroke:0;text-shadow:0 3px 0 #e46e48,3px 0 0 #e46e48,-3px 0 0 #e46e48,0 -3px 0 #e46e48,2px 2px 0 #e46e48,-2px 2px 0 #e46e48,2px -2px 0 #e46e48,-2px -2px 0 #e46e48,0 8px 0 rgba(140,60,30,.35);text-align:center;margin:0;font-weight:800}
#title .sub{text-align:center;font-size:20px;font-weight:700;color:#4f8a2e;margin:6px 0 12px}
#title .inner{display:grid;gap:8px;width:min(520px,100%)}
.night{position:absolute;inset:0;z-index:14;background:radial-gradient(ellipse at 50% 20%,#2b3f73,#0d1328 70%);color:#f3eedc;display:grid;place-items:center;padding:24px;text-align:center}
.night .in{max-width:560px;display:grid;gap:16px;justify-items:center}
.night p{font-size:21px;line-height:1.45;margin:0;font-weight:600}
.night .who{color:var(--gold)}
.night h1{font-size:clamp(36px,9vw,60px);margin:0;color:var(--gold);font-weight:800;line-height:1.05}
@media (max-width:560px){
  #quest{max-width:calc(100% - 168px)} #quest .box{padding:4px 8px 6px} #quest .t{font-size:18px} #quest .d{font-size:14px} #quest .eye{font-size:12px}
  .fm .sk{display:none} .fm .en{width:44px}
  #clock{grid-template-columns:auto;padding:3px 8px;justify-items:end} #clock .wx{display:none} #clock .day{font-size:14px} #clock .gold{font-size:15px}
  .slot{width:40px;height:40px}.slot img{width:30px;height:30px}
  #clock .time{font-size:20px}
  #menuBtn{bottom:auto;top:auto;left:10px;bottom:72px;font-size:16px;padding:2px 10px}
  #itemname{bottom:62px;font-size:15px}
}
</style>
</head>
<body>
<div id="game">
  <canvas id="view" aria-label="Nông trại Thác Hàn"></canvas>

  <div class="hud" id="quest" hidden><div class="box">
    <div class="eye" id="qEye"></div><div class="t" id="qT"></div><div class="d" id="qD"></div>
    <div class="p"><span class="bar"><i id="qBar"></i></span><span id="qN"></span></div>
  </div></div>

  <div class="hud" id="right" hidden>
    <div class="box" id="clock"><span class="day" id="cDay"></span><span class="time" id="cTime"></span><span class="wx" id="cWx"></span><span class="gold" id="cGold"></span></div>
    <div id="family"></div>
  </div>

  <div class="hud box" id="itemname" hidden></div>
  <div class="hud box" id="hotbar" hidden></div>
  <button class="box" id="menuBtn" type="button" hidden>Menu</button>
  <div class="hud box" id="toast" hidden></div>

  <div class="box" id="dlg" hidden tabindex="0" role="dialog"></div>
  <div id="modal"></div>
  <div id="title"></div>
</div>

<script>
(() => {
'use strict';
// ================= CONSTANTS =================
const TS = 16, MW = 40, MH = 30, HW = 10, HH = 8;
const MIN_PER_TICK = 10, MS_PER_TICK = 2000; // 10 game-minutes every 2 s
const SAVE_PREFIX = 'thachan-save-', LAST_KEY = 'thachan-last';
const canvas = document.getElementById('view'), ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);

// ================= ISO ART: hand-drawn cartoon, soft outlines, baked per zoom =================
function hash(x,y,s=0){ let h=(x*374761393 + y*668265263 + s*982451653)|0; h=(h^(h>>>13))*1274126177|0; return ((h^(h>>>16))>>>0)/4294967296; }
function rng(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
const HW2 = 32, HH2 = 16;                       // half tile width/height in iso px (2:1)
function iso(u,v,h=0){ return [(u-v)*HW2, (u+v)*HH2 - h]; }
function shade(hex,amt){ const n=parseInt(hex.slice(1),16); let r=(n>>16)+amt,g=(n>>8&255)+amt,b=(n&255)+amt; r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b)); return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1); }
const LINE = 'rgba(92,58,36,.72)';               // soft brown outline, never black
function ell(c,x,y,rx,ry,rot=0){ c.beginPath(); c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,Math.PI*2); }
function rrect(c,x,y,w,h,r){ c.beginPath(); r=Math.min(r,w/2,h/2); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function poly(c,pts){ c.beginPath(); pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y)); c.closePath(); }
function fs(c,fill,lw=1.3,stroke=LINE){ c.fillStyle=fill; c.fill(); if (lw){ c.lineWidth=lw; c.strokeStyle=stroke; c.stroke(); } }
function shadow(c,x,y,rx,ry=rx*.45,a=.2){ c.fillStyle=`rgba(46,70,28,${a})`; ell(c,x,y,rx,ry); c.fill(); }
function diamond(c,g=0.7){ poly(c,[[0,-HH2-g/2],[HW2+g,0],[0,HH2+g/2],[-HW2-g,0]]); }
function face3(c,a,b,cc,d,fill,lw=1.2){ poly(c,[a,b,cc,d]); fs(c,fill,lw); }

let Z = 2;                                       // device px per iso px
const SPR = {};
function spr(key,w,h,ox,oy,fn){
  let s = SPR[key]; if (s) return s;
  const c = document.createElement('canvas'); c.width = Math.max(1,Math.ceil(w*Z)); c.height = Math.max(1,Math.ceil(h*Z));
  const x = c.getContext('2d'); x.scale(Z,Z); x.translate(ox,oy); x.lineCap='round'; x.lineJoin='round'; fn(x);
  return SPR[key] = {c,ox,oy};
}
function clearSprites(){ for (const k in SPR) delete SPR[k]; }

// ---- ground ----
const GRASS = ['#8ccb5a','#88c757','#91cf60','#86c454'];
function tuft(c,x,y,col,h=4){ c.strokeStyle=col; c.lineWidth=1.1; c.beginPath(); c.moveTo(x-1.5,y); c.lineTo(x-2.2,y-h*.8); c.moveTo(x,y); c.lineTo(x,y-h); c.moveTo(x+1.5,y); c.lineTo(x+2.4,y-h*.75); c.stroke(); }
function inDiamond(r){ for(;;){ const a=r()*2-1,b=r()*2-1; if (Math.abs(a)+Math.abs(b)<.85) return [a*HW2,b*HH2]; } }
function flowerDot(c,x,y,col){ c.fillStyle=col; for (let k=0;k<5;k++){ const a=k/5*Math.PI*2; ell(c,x+Math.cos(a)*1.3,y+Math.sin(a)*.8,1.1,.8); c.fill(); } c.fillStyle='#ffe27a'; ell(c,x,y,.8,.6); c.fill(); }
function groundSprite(type,variant){
  return spr(`g_${type}_${variant}`,68,36,34,18,c=>{
    const r = rng(variant*977+type.length*131+7);
    const base = (col)=>{ diamond(c); c.fillStyle=col; c.fill(); };
    if (type==='grass'||type==='flower'){
      base(GRASS[variant%4]);
      for (let k=0;k<4;k++){ const [x,y]=inDiamond(r); tuft(c,x,y,r()<.5?'#6aaa40':'#a7dc77',3+r()*2); }
      if (type==='flower'||variant===3){ const cols=['#f7a1b8','#ffffff','#ffd166','#b9a7f2']; for (let k=0;k<(type==='flower'?4:1);k++){ const [x,y]=inDiamond(r); flowerDot(c,x,y,cols[Math.floor(r()*cols.length)]); } }
    } else if (type==='dark'){
      base(variant%2?'#6aa64b':'#64a046'); for (let k=0;k<5;k++){ const [x,y]=inDiamond(r); tuft(c,x,y,'#4e8a34',4); }
    } else if (type==='path'){
      base(variant%2?'#e9cb95':'#e5c690');
      for (let k=0;k<4;k++){ const [x,y]=inDiamond(r); c.fillStyle=r()<.5?'#d4b27a':'#f3dcae'; ell(c,x,y,1.6+r()*1.4,1+r()*.8); c.fill(); }
    } else if (type==='field'){
      base(variant%2?'#a9c763':'#a3c15d');
      for (let k=0;k<5;k++){ const [x,y]=inDiamond(r); tuft(c,x,y,'#7f9f3f',5+r()*3); }
      for (let k=0;k<3;k++){ const [x,y]=inDiamond(r); c.fillStyle='#b99a5e'; ell(c,x,y,1.4,.8); c.fill(); }
    } else if (type==='tilled'||type==='wet'){
      base(variant%2?'#a9c763':'#a3c15d');
      const soil = type==='wet' ? '#8a5a3a' : '#b98352', furrow = type==='wet' ? '#6a4128' : '#9a6a40', hi = type==='wet' ? '#9c6c4a' : '#d39c6a';
      c.save(); c.scale(.86,.86); diamond(c,0); c.restore(); c.fillStyle=soil; c.fill(); c.lineWidth=1.2; c.strokeStyle=shade(soil,-35); c.stroke();
      c.lineWidth=1.6; for (const t of [-.42,-.14,.14,.42]){ const [ax,ay]=[(-.5-t)*HW2*.86*-1,0]; c.strokeStyle=furrow; c.beginPath();
        const p1=[(-.45-t)*HW2*.86, (-.45+t)*HH2*.86], p2=[(.45-t)*HW2*.86, (.45+t)*HH2*.86]; c.moveTo(...p1); c.lineTo(...p2); c.stroke();
        c.strokeStyle=hi; c.lineWidth=.8; c.beginPath(); c.moveTo(p1[0],p1[1]-1.4); c.lineTo(p2[0],p2[1]-1.4); c.stroke(); c.lineWidth=1.6; }
      if (type==='wet'){ c.fillStyle='rgba(170,220,255,.35)'; ell(c,-6,-2,4,1.4); c.fill(); ell(c,8,3,3,1); c.fill(); }
    } else if (type==='water'||type==='ditch'||type==='ditchB'){
      base('#69c2e8');
      c.strokeStyle='#bde8fa'; c.lineWidth=1.2;
      for (let k=0;k<3;k++){ const ox=((k*13+variant*7)%30)-15, oy=((k*7)%14)-7; c.beginPath(); c.moveTo(ox-5,oy); c.quadraticCurveTo(ox,oy-2,ox+5,oy); c.stroke(); }
      if (type!=='water'){
        const stones=(a,b)=>{ for (let k=0;k<=6;k++){ const t=k/6, x=a[0]+(b[0]-a[0])*t, y=a[1]+(b[1]-a[1])*t; c.fillStyle=k%2?'#b8bcb4':'#a4a99f'; ell(c,x,y,3.6,2.4); c.fill(); c.lineWidth=.8; c.strokeStyle=LINE; c.stroke(); } };
        stones([0,-HH2],[HW2,0]); stones([-HW2,0],[0,HH2]);
      }
      if (type==='ditchB'){ c.fillStyle='#8a5a36'; c.beginPath(); c.moveTo(-14,-2); c.quadraticCurveTo(-4,-12,10,-4); c.quadraticCurveTo(16,4,4,8); c.quadraticCurveTo(-12,8,-14,-2); fs(c,'#8a5a36',1.1);
        c.strokeStyle='#5e3a22'; c.lineWidth=1; c.beginPath(); c.moveTo(-4,-6); c.lineTo(0,-1); c.lineTo(-2,4); c.stroke(); c.fillStyle='#69c2e8'; ell(c,14,-6,2,1); c.fill(); ell(c,-16,5,2,1); c.fill(); }
    } else if (type==='floor'){

// Draws a character with feet at (0,0). back = seen from behind, flip = facing screen-left, step = -1..1 walk phase
function drawChar(c,id,back,flip,step,t=0,blink=false){
  const L = LOOK[id], s = L.s, hs = L.head;
  c.save(); c.scale(flip?-s:s, s);
  const bob = Math.abs(step)*1.2;
  shadow(c,0,0,10,3.6,.22);
  c.translate(0,-bob);
  // legs
  const leg=(x,sw)=>{ c.save(); c.translate(x,-11); c.rotate(sw*.35); rrect(c,-2.4,0,4.8,11,2.2); fs(c, L.style==='com'?L.skin:L.pants,1.1); ell(c,0,11,3.2,1.9); fs(c, L.style==='banh'?'#e85a4a':'#7a5238',1); c.restore(); };
  leg(-3,step); leg(3,-step);
  // body
  c.beginPath();
  if (L.style==='com'){ c.moveTo(-6,-26); c.lineTo(6,-26); c.quadraticCurveTo(8,-17,10,-10); c.quadraticCurveTo(0,-7,-10,-10); c.quadraticCurveTo(-8,-17,-6,-26); }
  else if (L.style==='anh'||L.style==='ha'){ c.moveTo(-6.5,-27); c.lineTo(6.5,-27); c.quadraticCurveTo(8,-18,8.2,-11); c.quadraticCurveTo(0,-9,-8.2,-11); c.quadraticCurveTo(-8,-18,-6.5,-27); }
  else { c.moveTo(-7,-27); c.lineTo(7,-27); c.quadraticCurveTo(8.4,-19,7.6,-11); c.quadraticCurveTo(0,-9.5,-7.6,-11); c.quadraticCurveTo(-8.4,-19,-7,-27); }
  c.closePath(); fs(c,L.shirt,1.3);
  if (L.style==='anh' && !back){ c.fillStyle='#fff'; [-21,-17,-13].forEach(y=>{ ell(c,1.5,y,.9,.9); c.fill(); }); }
  if (L.style==='hiep'){ c.strokeStyle='#ffffff'; c.lineWidth=2.2; c.beginPath(); c.moveTo(-6,-26); c.quadraticCurveTo(0,-22,6,-26); c.stroke(); }
  if (L.style==='banh' && !back){ c.fillStyle='#ffe27a'; ell(c,0,-18,2.6,2.6); c.fill(); }
  if (L.style==='thanh'){ c.fillStyle=L.shirt2; c.fillRect(-1,-26,2,15); }
  // arms
  const arm=(x,sw)=>{ c.save(); c.translate(x,-25); c.rotate(sw*.45); rrect(c,-2,0,4,11,2); fs(c,L.shirt2,1.1); ell(c,0,11.5,2.2,2.2); fs(c,L.skin,1); c.restore(); };
  arm(-7.6,-step); arm(7.6,step);
  // head
  c.save(); c.translate(0,-35); c.scale(hs,hs);
  if (L.style==='anh' || L.style==='ha'){ c.beginPath(); c.moveTo(-9,-2); c.quadraticCurveTo(-12,10,-6,13); c.lineTo(6,13); c.quadraticCurveTo(12,10,9,-2); c.closePath(); fs(c,L.hair,1.2); }
  if (L.style==='com'){ [[-10,2],[10,2]].forEach(([x,y])=>{ ell(c,x,y,3.4,5); fs(c,L.hair,1.1); c.fillStyle='#ef5b4a'; ell(c,x*.82,y-4,2.4,1.6); c.fill(); }); }
  ell(c,0,0,10,10); fs(c,L.skin,1.3);
  // hair
  c.fillStyle=L.hair;
  if (back){ c.beginPath(); c.arc(0,0,10.2,Math.PI*.95,Math.PI*2.05); c.quadraticCurveTo(10,9,0,9.5); c.quadraticCurveTo(-10,9,-10.2,0); fs(c,L.hair,1.2);
    if (L.style==='anh'){ ell(c,0,8,3.4,6); fs(c,L.hair,1.1); c.fillStyle='#f59ab0'; ell(c,0,3,2.6,1.6); c.fill(); } }
  else {
    c.beginPath(); c.arc(0,0,10.3,Math.PI*1.02,Math.PI*1.98);
    if (L.style==='banh'){ c.quadraticCurveTo(6,-4,2,-3); c.quadraticCurveTo(-4,-5,-10.2,-1); }
    else if (L.style==='hiep'){ c.quadraticCurveTo(7,-5,3,-4); c.quadraticCurveTo(-3,-7,-10.2,-1); }
    else { c.quadraticCurveTo(8,-3,3,-4.5); c.quadraticCurveTo(-2,-2,-5,-5); c.quadraticCurveTo(-8,-2,-10.2,0); }
    c.closePath(); fs(c,L.hair,1.2);
    if (L.style==='banh'){ c.strokeStyle=L.hair; c.lineWidth=2; c.beginPath(); c.moveTo(1,-10); c.quadraticCurveTo(4,-15,6,-13); c.stroke(); }
    if (L.style==='anh'){ c.fillStyle='#ffd166'; ell(c,7,-6,2.2,2.2); c.fill(); c.fillStyle='#f59ab0'; ell(c,7,-6,1,1); c.fill(); }
    // face (shifted a little toward where they look)
    const ex = 1.4;
    if (blink){ c.strokeStyle='#3a2a22'; c.lineWidth=1.3; c.beginPath(); c.moveTo(-5+ex,2); c.lineTo(-2+ex,2); c.moveTo(3+ex,2); c.lineTo(6+ex,2); c.stroke(); }
    else { c.fillStyle='#3a2a22'; ell(c,-3.4+ex,1.6,1.9,2.5); c.fill(); ell(c,4.4+ex,1.6,1.9,2.5); c.fill(); c.fillStyle='#fff'; ell(c,-2.8+ex,.6,.8,.8); c.fill(); ell(c,5+ex,.6,.8,.8); c.fill(); }
    c.fillStyle='rgba(255,140,150,.45)'; ell(c,-6+ex,5,2.4,1.4); c.fill(); ell(c,7+ex,5,2.4,1.4); c.fill();
    c.strokeStyle='#a0503a'; c.lineWidth=1.1; c.beginPath(); c.arc(.5+ex,5.5,2,.15*Math.PI,.85*Math.PI); c.stroke();
    if (L.style==='thanh'){ c.fillStyle='#ffffff'; c.beginPath(); c.moveTo(-4+ex,6); c.quadraticCurveTo(.5+ex,4,5+ex,6); c.quadraticCurveTo(.5+ex,8,-4+ex,6); fs(c,'#ffffff',.8); c.beginPath(); c.moveTo(-3+ex,8); c.quadraticCurveTo(.5+ex,16,4+ex,8); fs(c,'#ffffff',.8); }
  }
  // conical hat (nón lá) for bác Thành
  if (L.style==='thanh'){ c.beginPath(); c.moveTo(-16,-3); c.quadraticCurveTo(0,-1,16,-3); c.lineTo(0,-19); c.closePath(); fs(c,'#f2dc9a',1.3); c.strokeStyle='#d9bd72'; c.lineWidth=.9; c.beginPath(); c.moveTo(-10,-5.5); c.lineTo(10,-5.5); c.moveTo(-5,-11); c.lineTo(5,-11); c.stroke(); }
  c.restore();
  c.restore();
}

function viewOf(dir){ return {down:[false,true], right:[false,false], up:[true,false], left:[true,true]}[dir] || [false,false]; }
const PORTRAIT = {};
function portraitURL(id,size,crop){
  const k=id+size+crop; if (PORTRAIT[k]) return PORTRAIT[k];
  const c=document.createElement('canvas'); c.width=size; c.height=Math.round(size*(crop?1:1.08)); const x=c.getContext('2d');
  x.lineCap='round'; x.lineJoin='round';
  const L=LOOK[id], k2 = crop ? size/30 : size/36;
  x.translate(size/2, crop ? size*0.62+ (35*L.s*L.head)*k2 - 0 : c.height-2); x.scale(k2,k2);
  if (crop) x.translate(0, 0);
  drawChar(x,id,false,false,0);
  return PORTRAIT[k]=c.toDataURL();
}
function portrait(id){ return portraitURL(id,120,false); }
function headshot(id){ const k='hs_'+id; if (PORTRAIT[k]) return PORTRAIT[k];
  const c=document.createElement('canvas'); c.width=72; c.height=72; const x=c.getContext('2d'); x.lineCap='round'; x.lineJoin='round';
  const L=LOOK[id], k2=72/34; x.translate(36, 36 + 35*L.s*k2 - 2*k2); x.scale(k2,k2); drawChar(x,id,false,false,0);
  return PORTRAIT[k]=c.toDataURL(); }

function genFarm(){
  const g = new Array(MW*MH).fill('grass'), o = new Array(MW*MH).fill(null);
  for (let y=0;y<MH;y++) for (let x=0;x<MW;x++){
    const v = hash(x,y,3);
    if (v>0.94) g[idx(x,y)] = 'flower';
    const border = x<2||x>=MW-2||y<2||y>=MH-2;
    if (border && !(y>=MH-2 && (x===19||x===20))){ g[idx(x,y)]='dark'; o[idx(x,y)]='forest'; }
  }
  const path = (x,y)=>{ g[idx(x,y)]='path'; o[idx(x,y)]=null; };
  for (let y=7;y<=9;y++) path(7,y);
  for (let x=7;x<=20;x++) path(x,9);
  for (let y=9;y<MH;y++){ path(19,y); path(20,y); }
  for (let y=FIELD.y;y<FIELD.y+FIELD.h;y++) for (let x=FIELD.x;x<FIELD.x+FIELD.w;x++) g[idx(x,y)]='field';
  for (let x=7;x<=18;x++) g[idx(x,16)]='ditch';
  for (let y=4;y<=7;y++) for (let x=29;x<=35;x++){ const dx=(x-32)/3.6, dy=(y-5.5)/2.2; if (dx*dx+dy*dy<1) g[idx(x,y)]='water'; }
  for (let x=3;x<=36;x++) if (x!==19 && x!==20) o[idx(x,19)]='fence';
  [6,25,33].forEach(x=>o[idx(x,19)]='fenceB');
  [[4,10],[12,8],[22,12],[26,8],[28,15],[5,22],[15,24],[30,23]].forEach(([x,y])=>o[idx(x,y)]='weed');
  [[24,10],[31,12],[10,23],[27,25],[34,17]].forEach(([x,y])=>o[idx(x,y)]='rock');
  [[24,4],[3,15],[36,13],[8,25],[33,26]].forEach(([x,y])=>o[idx(x,y)]='tree');
  o[idx(BIN.x,BIN.y)]='bin';
  return {g,o};
}

  if (e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA') return;
  if (KEYMAP[e.code]){ keys[KEYMAP[e.code]]=true; e.preventDefault(); return; }
  if (dlgOpen){ if (['Space','Enter','KeyE'].includes(e.code)){ e.preventDefault(); advanceDlg(); } return; }
  if (e.code==='Escape'){ if (modalOpen) closeModal(); else if (!paused) openMenu(); return; }

// ================= WORLD HELPERS =================
function me(){ return S.pos[S.active]; }
function mapOf(name){ return name==='farm' ? {g:S.g,o:S.o,w:MW,h:MH} : {g:HOUSE_IN.g,o:HOUSE_IN.o,w:HW,h:HH}; }
const SOLID = new Set(['forest','tree','rock','weed','fence','fenceB','bin','wall','bed','stove','table']);
function inRect(x,y,r){ return x>=r.x && x<r.x+r.w && y>=r.y && y<r.y+r.h; }
function solid(mapName,tx,ty){
  const m = mapOf(mapName);
  if (tx<0||ty<0||tx>=m.w||ty>=m.h) return true;
  const g = m.g[idx(tx,ty,m.w)], o = m.o[idx(tx,ty,m.w)];
  if (g==='water'||g==='ditch'||g==='ditchB') return true;
  if (o && SOLID.has(o)) return true;
  if (mapName==='farm'){
    if (inRect(tx,ty,HOUSE) && !(tx===HOUSE.door.x && ty===HOUSE.door.y)) return true;
    if (inRect(tx,ty,COOP)) return true;
  }
  return false;
}
function blocked(mapName,fx,fy){
  const pts=[[fx-4,fy-4],[fx+4,fy-4],[fx-4,fy-1],[fx+4,fy-1]];
  return pts.some(([x,y])=>solid(mapName,Math.floor(x/TS),Math.floor(y/TS)));
}
const DIRV = {up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function facingTile(p){ const [dx,dy]=DIRV[p.dir]; return [Math.floor(p.x/TS)+dx, Math.floor((p.y-3)/TS)+dy]; }

const NO_LINE = {banh:'Bánh còn bé, việc này để bố mẹ làm nhé!', com:'Việc này nặng quá với Cốm. Chọn bố Hiệp đi.'};
function spend(kind, who=S.active){

const particles = [];

function burst(tx,ty,col,n=8){ const [X,Y]=iso(tx+.5,ty+.5,6); for(let i=0;i<n;i++) particles.push({x:X,y:Y,vx:(Math.random()-.5)*80,vy:-Math.random()*80-20,life:.6,col}); }
// Which job a tap on this tile means; the right tool is picked automatically
function autoTool(tx,ty){
  if (inRect(tx,ty,COOP)) return 'coop';
  if (tx===BIN.x && ty===BIN.y) return 'bin';
  if (tx<0||ty<0||tx>=MW||ty>=MH) return null;
  const i=idx(tx,ty), g=S.g[i], o=S.o[i], s=S.soil[i];
  if (o==='weed') return 'scythe';
  if (o==='rock'||o==='fenceB'||g==='ditchB') return 'hammer';
  if (o==='mud') return 'hoe';
  if (s){ if (s.crop){ if (s.crop.days>=3) return 'scythe'; return s.w ? 'done' : 'can'; } return 'seed'; }
  if (g==='field' && !o) return 'hoe';
  if (g==='ditch'||g==='water') return 'can';
  if (o==='tree') return 'tree';
  return null;
}
function face(p,tx,ty){
  const cx=Math.floor(p.x/TS), cy=Math.floor((p.y-3)/TS), dx=tx-cx, dy=ty-cy;
  if (dx||dy) p.dir = Math.abs(dx)>Math.abs(dy) ? (dx<0?'left':'right') : (dy<0?'up':'down');
}
function doAt(who, tx, ty){
  const p = S.pos[who]; face(p,tx,ty);

  const th = S.thanh;

  if (p.map==='house'){
    const o = HOUSE_IN.o[idx(tx,ty,HW)];

    if (o==='stove') return cook(who);

    return;
  }
  const tool = autoTool(tx,ty);
  if (!tool) return;
  const hi = HOTBAR.findIndex(h=>h.id===tool); if (hi>=0){ if (who==='anh') S.hb = hi; p.swing = {t:.25, tool}; }
  if (tool==='coop') return coopAction(who);
  if (tool==='bin') return shipAction();
  if (tool==='done') return say('Ô này tưới rồi. Ngày mai tưới tiếp.',1400);
  if (tool==='tree') return say('Cây xoài già của ông. Chương 4 sẽ có cả một khu vườn.');
  const i=idx(tx,ty), g=S.g[i], o=S.o[i], soil=S.soil[i];
  switch (tool){
    case 'scythe':

      break;
    case 'hammer':
      if (!spend('hammer',who)) return;
      if (o==='rock'){ S.o[i]=null; S.c.rock++; burst(tx,ty,'#9aa3a8',10); }
      else if (o==='fenceB'){ S.o[i]='fence'; S.c.fence++; burst(tx,ty,'#c98a4b'); }
      else { S.g[i]='ditch'; S.c.ditch++; burst(tx,ty,'#7fc4ef'); }
      break;
    case 'hoe':
      if (o!=='mud' && S.q<4) return say('Gặp bác Thành ở cổng phía nam trước đã.');
      if (!spend('hoe',who)) return;
      if (o==='mud'){ S.o[i]=null; S.c.mud++; burst(tx,ty,'#7a5230'); }
      else { S.soil[i]={w:false,crop:null}; burst(tx,ty,'#9a6436'); }

    case 'can':

      if (!spend('can',who)) return; soil.w=true; S.water--; burst(tx,ty,'#7fc4ef',6);

      break;

}
function coopAction(who){

function shipAction(){

// ================= TAP TO MOVE =================
let cam = {x:0,y:0};
function walkable(map,x,y){
  if (solid(map,x,y)) return false;
  if (map==='farm' && x===HOUSE.door.x && y===HOUSE.door.y) return false;
  if (map==='house' && y>=HH-1) return false;
  return true;
}
function findPath(map,from,goals){
  const m = mapOf(map), W=m.w, H=m.h, key=(x,y)=>y*W+x;
  const goalSet = new Set(goals.filter(([x,y])=>x>=0&&y>=0&&x<W&&y<H).map(([x,y])=>key(x,y)));
  if (!goalSet.size) return null;
  const prev = new Map([[key(...from), -1]]), q=[from];
  while (q.length){
    const [x,y] = q.shift(), k=key(x,y);
    if (goalSet.has(k)){ const out=[]; let c=k; while (c!==-1){ out.push([c%W, Math.floor(c/W)]); c=prev.get(c); } return out.reverse(); }
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx, ny=y+dy, nk=key(nx,ny);
      if (nx<0||ny<0||nx>=W||ny>=H||prev.has(nk)) continue;
      if (!walkable(map,nx,ny)) continue;
      prev.set(nk,k); q.push([nx,ny]);
    }
  }
  return null;
}
function goTo(who, tx, ty, act, standOn, quiet, extra){
  const p = S.pos[who];
  const from = [Math.floor(p.x/TS), Math.floor((p.y-3)/TS)];
  const goals = standOn ? [[tx,ty]] : [[tx,ty+1],[tx,ty-1],[tx-1,ty],[tx+1,ty]].filter(([x,y])=>walkable(p.map,x,y));
  const path = findPath(p.map, from, goals);
  if (!path){ if (!quiet) toast(`${LOOK[who].name} không đi tới đó được.`,1400); return false; }
  p.path = path; p.goal = {tx,ty,act,extra:extra||null};
  if (who==='anh') marker = {map:p.map,tx,ty,t:0.9};
  return true;
}
function enterHouse(p){ p.map='house'; p.x=4*TS+8; p.y=6*TS+10; p.dir='up'; }
function exitHouse(p){ p.map='farm'; p.x=HOUSE.door.x*TS+8; p.y=(HOUSE.door.y+1)*TS+12; p.dir='down'; }
function arrive(who, g){
  const p = S.pos[who];
  if (!g) return;
  if (g.act==='enter') return enterHouse(p);
  if (g.act==='exit') return exitHouse(p);
  if (g.act==='talk') return startTalk(g.extra);
  if (g.act==='act'){
    doAt(who, g.tx, g.ty);
    if (who!=='anh'){ ai(who).cool = 0.9; const pool = DONE_LINE[g.extra]; if (pool && Math.random()<0.35) bubble(who, pool[Math.floor(Math.random()*pool.length)], 2); }
  }
}

// ================= FAMILY AI: Hiệp, Cốm, Bánh work on their own =================
const HELPERS = ['hiep','com','banh'];
const DOING = {anh:'Bạn điều khiển', hiep:'Đang ra đồng', com:'Đang ra đồng', banh:'Đang ra đồng'};
const JOBTEXT = {rock:'Đang đập đá', fenceB:'Đang sửa rào', ditchB:'Đang sửa mương', mud:'Đang dọn bùn', coopfix:'Đang sửa chuồng gà', water:'Đang tưới lúa', refill:'Đang múc nước', feed:'Đang cho gà ăn', egg:'Đang nhặt trứng'};
const DONE_LINE = {
  rock:['Hự! Xong một hòn.','Đá ơi là đá…','Hòn này nặng thật.'],
  fenceB:['Rào chắc rồi!','Xong một đoạn.'],
  ditchB:['Nước chảy lại rồi!'], mud:['Bùn ngập tới mắt cá.'],
  water:['Uống đi lúa ơi!','Tưới xong ô này!','La la la…'], refill:['Múc đầy nước rồi!'],
};
function ai(m){ const q=S.pos[m]; if (!q.ai) q.ai={cool:0,hold:0,wander:0,think:0}; return q.ai; }
function tileOf(q){ return [Math.floor(q.x/TS), Math.floor((q.y-3)/TS)]; }
function claimed(m,tx,ty){ return MEMBERS.some(o=>o!==m && S.pos[o].goal && S.pos[o].goal.tx===tx && S.pos[o].goal.ty===ty); }
function dryCrops(){ const out=[]; for (const k in S.soil){ const s=S.soil[k]; if (s.crop && s.crop.days<3 && !s.w) out.push(+k); } return out; }
function jobsFor(m){
  const jobs=[], add=(tx,ty,kind,pri=0)=>{ if (!claimed(m,tx,ty)) jobs.push({tx,ty,kind,pri}); };
  const can = k => S.energy[m] >= (ACT[k].best.includes(m)?1:2);
  if (m==='hiep'){
    if (can('hammer')){
      for (let i=0;i<S.o.length;i++){ const o=S.o[i]; if (o==='rock'||o==='fenceB') add(i%MW,Math.floor(i/MW),o); if (S.g[i]==='ditchB') add(i%MW,Math.floor(i/MW),'ditchB',1); }
      if (S.coop.has && !S.coop.fixed) add(COOP.door.x,COOP.door.y,'coopfix',2);
    }
    if (can('hoe')) for (let i=0;i<S.o.length;i++) if (S.o[i]==='mud') add(i%MW,Math.floor(i/MW),'mud');
  } else {
    const c = S.coop;
    if (c.fixed && c.name){
      if (m==='banh' && c.egg) add(COOP.door.x,COOP.door.y,'egg',3);
      if (m==='com' && c.egg && S.energy.banh<1) add(COOP.door.x,COOP.door.y,'egg',3);
      if (m==='com' && !c.egg && !c.fed && S.inv.lua > (S.flags.cooked?0:2)) add(COOP.door.x,COOP.door.y,'feed',2);
    }
    if (can('can')){
      const dry = dryCrops();
      if (dry.length){
        if (S.water<=0){ for (let x=7;x<=18;x++) if (S.g[idx(x,16)]==='ditch') jobs.push({tx:x,ty:16,kind:'refill',pri:4}); }
        else dry.forEach(i=>add(i%MW,Math.floor(i/MW),'water',1));
      }
    }
  }
  return jobs;
}
function aiUpdate(m,dt){
  const q=S.pos[m], a=ai(m);
  if (a.hold>0){ a.hold-=dt; return; }
  if (a.cool>0){ a.cool-=dt; return; }
  if (q.path) return;
  a.think-=dt; if (a.think>0) return; a.think=0.7;
  const night = S.time>=1140 || S.time<390;
  if (night){
    DOING[m] = 'Ở nhà nghỉ';
    if (q.map==='farm') goTo(m,HOUSE.door.x,HOUSE.door.y+1,'enter',true,true);
    else wander(m,2,1);
    return;
  }
  if (q.map==='house'){ DOING[m]='Đang ra đồng'; goTo(m,4,HH-2,'exit',true,true); return; }
  const jobs = jobsFor(m);
  if (jobs.length){
    const [x,y] = tileOf(q);
    jobs.sort((A,B)=>(B.pri-A.pri) || ((Math.abs(A.tx-x)+Math.abs(A.ty-y))-(Math.abs(B.tx-x)+Math.abs(B.ty-y))));
    for (const j of jobs.slice(0,6)) if (goTo(m,j.tx,j.ty,'act',false,true,j.kind)){ DOING[m]=JOBTEXT[j.kind]; return; }
  }
  const tired = S.energy[m] < 2;
  DOING[m] = tired ? 'Mệt, đang nghỉ' : (m==='hiep' ? 'Đang nghỉ tay' : 'Đang chơi');
  a.wander-=0.7;
  if (a.wander<=0){
    a.wander = 4+Math.random()*5;
    // idle people drift toward someone to chat with
    const others = MEMBERS.filter(o=>o!==m && S.pos[o].map===q.map);
    const pick = (m!=='hiep' && S.pos.anh.map===q.map && Math.random()<0.6) ? 'anh' : others[Math.floor(Math.random()*others.length)];
    if (others.length && Math.random()<0.65){ const o=S.pos[pick], [ox,oy]=tileOf(o); goTo(m,ox,oy,null,false,true); }
    else wander(m,3,2);
  }
}
function wander(m,rx,ry){
  const q=S.pos[m], [x,y]=tileOf(q);
  for (let k=0;k<8;k++){ const nx=x+Math.floor(Math.random()*(rx*2+1))-rx, ny=y+Math.floor(Math.random()*(ry*2+1))-ry;
    if (walkable(q.map,nx,ny) && (q.map!=='farm' || (ny<19 && !S.soil[idx(nx,ny)]))){ goTo(m,nx,ny,null,true,true); return; } }
}

// ================= SPEECH BUBBLES & CHATTER =================
const bubbles = [];
let convo = null, chatT = 4, lastConvo = '';
function bubble(who,text,dur){ for (let i=bubbles.length-1;i>=0;i--) if (bubbles[i].who===who) bubbles.splice(i,1); bubbles.push({who,text,t:dur||Math.min(5.5,1.8+text.length*0.055)}); }
function posOf(who){ return who==='thanh' ? S.thanh : S.pos[who]; }
function playConvo(lines){
  const ppl=[...new Set(lines.map(l=>l[0]))];
  for (const w of ppl) if (S.pos[w] && w!=='anh'){ const a=ai(w); a.hold=999; S.pos[w].path=null; S.pos[w].goal=null; S.pos[w].moving=false; }
  if (ppl.length===2){ const A=posOf(ppl[0]), B=posOf(ppl[1]); if (A&&B){ if (ppl[0]!=='anh') faceTo(A,B); if (ppl[1]!=='anh') faceTo(B,A); } }
  convo = {lines, i:-1, t:0, ppl}; nextLine();
}
function faceTo(A,B){ const dx=B.x-A.x, dy=B.y-A.y; A.dir = Math.abs(dx)>Math.abs(dy) ? (dx<0?'left':'right') : (dy<0?'up':'down'); }
function nextLine(){
  convo.i++;
  if (convo.i>=convo.lines.length){ for (const w of convo.ppl) if (S.pos[w]) ai(w).hold=0.4; convo=null; return; }
  const [w,t] = convo.lines[convo.i], d = Math.min(5.5,2+t.length*0.06);
  bubble(w,t,d); convo.t = d+0.15;
}
function tryChatter(){
  const p = me();
  const near = (a,b)=>{ const A=posOf(a),B=posOf(b); return A.map===B.map && A.map===p.map && Math.hypot(A.x-B.x,A.y-B.y) < 96; };
  const ppl = MEMBERS.filter(m=>S.pos[m].map===p.map);
  const pairs = [];
  for (let i=0;i<ppl.length;i++) for (let j=i+1;j<ppl.length;j++){
    const a=ppl[i], b=ppl[j]; if ((a==='anh'||b==='anh') && p.path) continue;
    const key=[a,b].sort().join('_'); if (CHAT[key] && near(a,b)) pairs.push(key);
  }
  if (pairs.length && Math.random()<0.8){
    const key = pairs[Math.floor(Math.random()*pairs.length)], pool = CHAT[key];
    let k = Math.floor(Math.random()*pool.length); if (key+k===lastConvo) k=(k+1)%pool.length;
    lastConvo = key+k; playConvo(pool[k]); return;
  }
  const solo = ppl.filter(m=>m!=='anh' && Math.hypot(S.pos[m].x-p.x,S.pos[m].y-p.y)<220);
  if (S.thanh.show && S.thanh.map===p.map && Math.hypot(S.thanh.x-p.x,S.thanh.y-p.y)<160) solo.push('thanh');
  if (solo.length){ const w=solo[Math.floor(Math.random()*solo.length)], pool=SOLO[w]; bubble(w,pool[Math.floor(Math.random()*pool.length)]); }
}
function talkTo(m){
  const p = me(), q = S.pos[m];
  if (q.map===p.map && Math.hypot(q.x-p.x,q.y-p.y) < 30) return startTalk(m);
  if (q.map!==p.map) return toast(`${LOOK[m].name} đang ở ${q.map==='house'?'trong nhà':'ngoài đồng'}.`,1600);
  const a=ai(m); a.hold = Math.max(a.hold,8); q.path=null; q.goal=null;
  const [tx,ty] = tileOf(q); goTo('anh',tx,ty,'talk',false,false,m);
}
function startTalk(m){
  const p = me(), q = S.pos[m];
  faceTo(p,q); faceTo(q,p); ai(m).hold = 999; q.path=null; q.goal=null;
  if (!S.talkIdx) S.talkIdx = {}; if (!S.talked) S.talked = {};
  const pool = TALK[m], k = (S.talkIdx[m]||0) % pool.length; S.talkIdx[m] = k+1;
  dialogue(pool[k], ()=>{
    ai(m).hold = 0.6;
    if (S.talked[m]!==S.day){ S.talked[m]=S.day; S.energy[m]=Math.min(MAXE[m],S.energy[m]+10); toast(`${LOOK[m].name} vui hẳn lên (+10 thể lực)`,1800); renderFamily(); }
  });
}
function wrapText(text,maxW){
  const words=text.split(' '), lines=[]; let cur='';
  for (const w of words){ const t=cur?cur+' '+w:w; if (ctx.measureText(t).width>maxW && cur){ lines.push(cur); cur=w; } else cur=t; }
  if (cur) lines.push(cur); return lines;
}
function drawBubbles(p){
  if (!bubbles.length) return;
  ctx.setTransform(1,0,0,1,0,0);
  const fs = Math.max(14, Math.round(Z*7.5));
  ctx.font = `600 ${fs}px "Baloo 2","Nunito",system-ui,sans-serif`; ctx.textBaseline='top';
  for (const b of bubbles){
    const q = posOf(b.who); if (!q || q.map!==p.map || (b.who==='thanh' && !S.thanh.show)) continue;
    const [X,Y] = charIso(q), sx = (X-camX)*Z, sy = (Y-(b.who==='thanh'?62:52*LOOK[b.who].s)-camY)*Z;
    const lines = wrapText(b.text, Math.min(canvas.width*0.62, fs*11));
    const w = Math.max(...lines.map(l=>ctx.measureText(l).width)) + fs*0.9, hh = lines.length*fs*1.12 + fs*0.55;
    let bx = Math.round(sx-w/2), by = Math.round(sy-hh-fs*0.55);
    bx = Math.max(4, Math.min(canvas.width-w-4, bx)); by = Math.max(4, by);
    ctx.globalAlpha = Math.min(1, b.t/0.3);
    ctx.fillStyle = b.who==='anh' ? '#fff3d6' : '#fffaf0'; ctx.strokeStyle = 'rgba(92,58,36,.8)'; ctx.lineWidth = Math.max(2, Z*1.2);
    ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(bx,by,w,hh,fs*0.7); else ctx.rect(bx,by,w,hh); ctx.fill(); ctx.stroke();
    const tx = Math.max(bx+fs*0.6, Math.min(bx+w-fs*0.6, sx));
    ctx.beginPath(); ctx.moveTo(tx-fs*0.35,by+hh-1); ctx.lineTo(tx,by+hh+fs*0.5); ctx.lineTo(tx+fs*0.35,by+hh-1); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(tx-fs*0.35,by+hh); ctx.lineTo(tx,by+hh+fs*0.5); ctx.lineTo(tx+fs*0.35,by+hh); ctx.stroke();
    ctx.fillStyle = '#3b2412';
    lines.forEach((l,i)=>ctx.fillText(l, bx+fs*0.45, by+fs*0.3+i*fs*1.12));
    ctx.globalAlpha = 1;
  }
}

// ================= LOOP =================
let last = performance.now(), tickAcc = 0, anim = 0;
function update(dt){
  anim += dt;
  for (let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=180*dt; if (p.life<=0) particles.splice(i,1); }
  if (marker){ marker.t -= dt; if (marker.t<=0) marker=null; }
  if (!S) return;
  for (const m of MEMBERS){ const q=S.pos[m]; if (q.swing){ q.swing.t-=dt; if (q.swing.t<=0) q.swing=null; } }
  if (paused) return;
  S.playMs += dt*1000;
  for (let i=bubbles.length-1;i>=0;i--){ bubbles[i].t-=dt; if (bubbles[i].t<=0) bubbles.splice(i,1); }
  if (convo){ convo.t-=dt; if (convo.t<=0) nextLine(); }
  else { chatT-=dt; if (chatT<=0){ chatT = 7+Math.random()*8; tryChatter(); } }
  for (const m of HELPERS) aiUpdate(m,dt);
  // time
  tickAcc += dt*1000;
  if (tickAcc >= MS_PER_TICK){ tickAcc -= MS_PER_TICK; S.time += MIN_PER_TICK; renderClock();
    for (const m of HELPERS) if (!S.pos[m].path && !/^Đang (đập|sửa|dọn|tưới|múc|cho|nhặt)/.test(DOING[m])) S.energy[m] = Math.min(MAXE[m], S.energy[m]+2);
    if (S.time === 1320) toast('Đã 22 giờ. Nên về nhà ngủ thôi.');
    if (S.time >= 1560){ sleep(true); return; } }
  // keyboard moves the selected person and cancels their walking order
  const p = me(); let kx=0, ky=0;
  if (keys.left) kx-=1; if (keys.right) kx+=1; if (keys.up) ky-=1; if (keys.down) ky+=1;
  let dx = kx+ky, dy = ky-kx; if (dx||dy){ const n=Math.hypot(dx,dy); dx/=n; dy/=n; }
  if (dx||dy){
    p.path = null; p.goal = null;
    p.dir = Math.abs(dx)>Math.abs(dy)+.01 ? (dx<0?'left':'right') : Math.abs(dy)>Math.abs(dx)+.01 ? (dy<0?'up':'down') : (ky<0 ? (kx<0?'left':'up') : (kx<0?'down':'right'));
    const speed = speedOf(S.active);
    const nx = p.x + dx*speed*dt, ny = p.y + dy*speed*dt;
    if (!blocked(p.map,nx,p.y)) p.x = nx;
    if (!blocked(p.map,p.x,ny)) p.y = ny;
    const tx=Math.floor(p.x/TS), ty=Math.floor((p.y-2)/TS);
    const atHouseDoor = p.map==='farm' && tx===HOUSE.door.x && (ty===HOUSE.door.y || (ty===HOUSE.door.y+1 && keys.up && p.y-ty*TS<7));
    const atExit = p.map==='house' && (ty>=HH-1 || (tx===4 && ty===HH-2 && keys.down && (ty+1)*TS-p.y<4));
    if (atHouseDoor){ enterHouse(p); keys.up=false; }
    else if (atExit){ exitHouse(p); keys.down=false; }
  }
  // everyone with an order walks it, so the family can work side by side
  for (const m of MEMBERS){
    const q = S.pos[m];
    q.moving = (m===S.active && !!(dx||dy));
    if (!q.path) continue;
    if (m!=='anh' && ai(m).hold>0) { q.moving=false; continue; }
    if (!q.path.length){ const g=q.goal; q.path=null; q.goal=null; arrive(m,g); if (paused) return; continue; }
    const [nx,ny] = q.path[0], gx = nx*TS+8, gy = ny*TS+12;
    const ddx = gx-q.x, ddy = gy-q.y, d = Math.hypot(ddx,ddy), sp = speedOf(m)*dt;
    if (d <= sp){ q.x = gx; q.y = gy; q.path.shift(); }
    else { q.x += ddx/d*sp; q.y += ddy/d*sp; q.dir = Math.abs(ddx)>Math.abs(ddy) ? (ddx<0?'left':'right') : (ddy<0?'up':'down'); }
    q.moving = true;
  }
}
function speedOf(m){ return m==='banh'?58:m==='com'?68:76; }

function bang(X,Y){ at(X,Y+Math.sin(anim*4)*1.5); rrect(ctx,-6,-9,12,15,6); fs(ctx,'#ffffff',1.3); ctx.fillStyle='#ef5b4a'; rrect(ctx,-1.4,-6,2.8,6.5,1.4); ctx.fill(); ell(ctx,0,3,1.5,1.5); ctx.fill(); ctx.setTransform(1,0,0,1,0,0); }
function eggBubble(X,Y){ at(X,Y+Math.sin(anim*4)*1.5); ell(ctx,0,0,10,9); fs(ctx,'#ffffff',1.3); ell(ctx,0,.5,4.2,5.4); fs(ctx,'#fff4e0',1); ctx.setTransform(1,0,0,1,0,0); }
function drawInteriorWalls(){
  const P=(u,v,h=0)=>{ const [x,y]=iso(u,v,h); return [x,y]; };
  at(0,0);
  // left wall along u=1 and back wall along v=2
  face3(ctx,P(1,2),P(1,7),P(1,7,64),P(1,2,64),'#f6e1b5',1.4);
  face3(ctx,P(1,2),P(9,2),P(9,2,64),P(1,2,64),'#efd3a0',1.4);
  face3(ctx,P(1,2),P(1,7),P(1,7,16),P(1,2,16),'#d6a26c',1.2);
  face3(ctx,P(1,2),P(9,2),P(9,2,16),P(1,2,16),'#c9945e',1.2);
  // window with curtains on the back wall
  face3(ctx,P(3.2,2,26),P(4.6,2,26),P(4.6,2,48),P(3.2,2,48),'#bfe6f5',1.3);
  ctx.fillStyle='#ffffff'; poly(ctx,[P(3.4,2,40),P(3.9,2,40),P(3.9,2,46),P(3.4,2,46)]); ctx.globalAlpha=.5; ctx.fill(); ctx.globalAlpha=1;
  face3(ctx,P(2.9,2,24),P(3.25,2,24),P(3.25,2,50),P(2.9,2,50),'#f59ab0',1); face3(ctx,P(4.55,2,24),P(4.9,2,24),P(4.9,2,50),P(4.55,2,50),'#f59ab0',1);
  // family altar shelf + calendar
  face3(ctx,P(6.6,2,34),P(8.2,2,34),P(8.2,2,37),P(6.6,2,37),'#a86a3e',1);
  [[6.9,'#e4524a'],[7.4,'#f6c443'],[7.9,'#e4524a']].forEach(([u,col])=>{ const [x,y]=P(u,2,41); ell(ctx,x,y,2.2,3.4); fs(ctx,col,.9); });
  face3(ctx,P(1,5.5,30),P(1,6.4,30),P(1,6.4,46),P(1,5.5,46),'#ffffff',1.1); face3(ctx,P(1,5.5,42),P(1,6.4,42),P(1,6.4,46),P(1,5.5,46),'#ef5b4a',.9);
  // picture of the grandparents
  face3(ctx,P(1,3.2,32),P(1,4.2,32),P(1,4.2,46),P(1,3.2,46),'#b8784a',1.2); face3(ctx,P(1,3.35,34),P(1,4.05,34),P(1,4.05,44),P(1,3.35,44),'#f3e6c8',.8);
  // doormat glow at the door
  const [dx,dy]=P(4.5,7.5); ell(ctx,dx,dy,16,7); fs(ctx,'#c4553a',1);
  ctx.setTransform(1,0,0,1,0,0);
}
function lighting(farm){
  ctx.setTransform(1,0,0,1,0,0);
  const t=S.time, W=canvas.width, H=canvas.height;
  if (farm){
    if (t<540){ ctx.fillStyle=`rgba(255,206,140,${.16*(540-t)/180})`; ctx.fillRect(0,0,W,H); }
    else if (t>=960 && t<1140){ ctx.fillStyle=`rgba(255,150,70,${.15*Math.min(1,(t-960)/120)})`; ctx.fillRect(0,0,W,H); }
    if (S.weather==='rain'){
      ctx.fillStyle='rgba(70,92,130,.24)'; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='rgba(215,232,255,.6)'; ctx.lineWidth=Math.max(1,Z*.8); ctx.beginPath();
      for (let i=0;i<140;i++){ const X=((hash(i,1)*W - anim*60*Z)%W+W)%W, Y=(hash(i,2)*H + anim*420*Z)%H; ctx.moveTo(X,Y); ctx.lineTo(X-3*Z,Y+11*Z); }
      ctx.stroke();
    }
  }
  const night = t>=1080 ? Math.min(.55,(t-1080)/240*.55) : 0;
  if (night>0){
    ctx.fillStyle = farm ? `rgba(40,34,112,${night})` : `rgba(40,24,60,${night*.35})`; ctx.fillRect(0,0,W,H);
    const glows = farm ? [[HOUSE.x+.8,HOUSE.y+HOUSE.h,30,46],[HOUSE.x+4.2,HOUSE.y+HOUSE.h,30,46],[HOUSE.x+2.5,HOUSE.y+HOUSE.h+.5,14,80]] : [[4,5,30,140]];
    ctx.globalCompositeOperation='lighter';
    for (const [u,v,h,r] of glows){ const [X,Y]=iso(u,v,h), sx=(X-camX)*Z, sy=(Y-camY)*Z, R=r*Z; const g=ctx.createRadialGradient(sx,sy,0,sx,sy,R); g.addColorStop(0,`rgba(255,186,90,${night*.85})`); g.addColorStop(1,'rgba(255,186,90,0)'); ctx.fillStyle=g; ctx.fillRect(sx-R,sy-R,R*2,R*2); }
    ctx.globalCompositeOperation='source-over';
  }
}
function drawWorld(){
  const p = me(), farm = p.map==='farm', mp = mapOf(p.map);
  const [ax,ay] = charIso(p);
  const minX = farm ? -MH*HW2 : -HH*HW2, maxX = farm ? MW*HW2 : HW*HW2, maxY = farm ? (MW+MH)*HH2 : (HW+HH)*HH2;
  let cx = ax - viewW/2, cy = ay - viewH/2 - 20;
  if (maxX-minX+80 < viewW) cx = (minX+maxX)/2 - viewW/2; else cx = Math.max(minX-40, Math.min(maxX+40-viewW, cx));
  if (maxY+160 < viewH) cy = maxY/2 - viewH/2 - 30; else cy = Math.max(-140, Math.min(maxY+40-viewH, cy));
  camX = cx; camY = cy;
  ctx.setTransform(1,0,0,1,0,0); ctx.imageSmoothingEnabled = true;
  ctx.fillStyle = farm ? '#5c9842' : '#3b2a20'; ctx.fillRect(0,0,canvas.width,canvas.height);
  const vis = (X,Y,pad=40)=> X>camX-pad-HW2 && X<camX+viewW+pad+HW2 && Y>camY-pad-HH2 && Y<camY+viewH+pad+110;
  const wf = Math.floor(anim*1.6)%2;
  for (let y=0;y<mp.h;y++) for (let x=0;x<mp.w;x++){
    const [X,Y] = iso(x+.5,y+.5); if (!vis(X,Y)) continue;
    const i = idx(x,y,mp.w), g = mp.g[i];
    if (!farm && (g==='wall'||g==='wallLow')) continue;
    let type = g, variant = Math.floor(hash(x,y)*4);
    if (farm && S.soil[i]) type = S.soil[i].w ? 'wet' : 'tilled';
    else if (g==='water'||g==='ditch') variant = wf + (x%2)*2;
    put(groundSprite(type,variant), X, Y);
  }
  const list = [], push = (k,fn)=>list.push({k,fn});
  if (farm){
    for (let y=0;y<MH;y++) for (let x=0;x<MW;x++){
      const [X,Y] = iso(x+.5,y+.5); if (!vis(X,Y,90)) continue;
      const i = idx(x,y), o = S.o[i], s = S.soil[i];
      if (s && s.crop) push(x+y+.8, ()=>put(cropSprite(Math.min(3,s.crop.days)),X,Y));
      if (!o) continue;
      if (o==='forest'){ if ((x+y)%2===0) push(x+y+1,()=>put(treeSprite(Math.floor(hash(x,y,2)*6)),X,Y)); else if (hash(x,y,5)<.6) push(x+y+1,()=>put(bushSprite(Math.floor(hash(x,y,9)*3)),X,Y)); continue; }
      if (o==='tree'){ push(x+y+1, ()=>put(treeSprite(1+3*Math.floor(hash(x,y)*2)),X,Y)); continue; }
      if (o==='mud'){ push(x+y+.5, ()=>put(spr('p_mud',44,22,22,11,PROP.mud),X,Y)); continue; }
      if (PROP[o]) push(x+y+1, ()=>put(spr('p_'+o,52,46,26,36,PROP[o]),X,Y));
    }
    const [hx,hy] = iso(HOUSE.x,HOUSE.y);
    push(Math.max(HOUSE.x+HOUSE.w+HOUSE.y, HOUSE.x+HOUSE.y+HOUSE.h)-.01, ()=>put(houseSprite(),hx,hy));
    const [kx,ky] = iso(COOP.x,COOP.y);
    push(Math.max(COOP.x+COOP.w+COOP.y, COOP.x+COOP.y+COOP.h)-.01, ()=>{ put(coopSprite(S.coop.fixed),kx,ky); if (S.coop.has && S.coop.egg) eggBubble(...iso(COOP.x+1.5,COOP.y+1.5,72)); });
    if (S.coop.fixed && S.coop.name){
      const t = anim*.5, cu = COOP.x+COOP.w+.6+Math.sin(t)*1.1, cv = COOP.y+COOP.h+.6+Math.sin(t*1.7)*.4;
      push(cu+cv, ()=>{ const [X,Y]=iso(cu,cv), s=chickenSprite(Math.floor(anim*4)%2);
        if (Math.cos(t)<0){ ctx.save(); const sx=Math.round((X-camX)*Z); ctx.translate(sx*2,0); ctx.scale(-1,1); put(s,X,Y); ctx.restore(); } else put(s,X,Y); });
    }
    if (S.thanh.show && S.thanh.map==='farm'){ const t=S.thanh; push(charKey(t), ()=>{ const [X,Y]=charIso(t); drawCharAt('thanh',X,Y,t.dir,0); if (S.q===3||S.q===8) bang(X,Y-66); }); }
    if (S.time<1080 && S.weather!=='rain') for (const b of butterflies){
      const t=anim*.45+b.ph, u=b.u+Math.sin(t)*2.2, v=b.v+Math.cos(t*1.3)*1.6, h=16+Math.sin(t*3)*6;
      push(u+v+.5, ()=>{ const [X,Y]=iso(u,v,h), f=Math.abs(Math.sin(anim*14+b.ph)); at(X,Y); ctx.fillStyle=b.col; ctx.strokeStyle=LINE; ctx.lineWidth=.6;
        ell(ctx,-2.2,0,2.8*f+.4,2.2); ctx.fill(); ctx.stroke(); ell(ctx,2.2,0,2.8*f+.4,2.2); ctx.fill(); ctx.stroke(); ctx.fillStyle='#5a3a24'; ell(ctx,0,0,.6,1.7); ctx.fill(); ctx.setTransform(1,0,0,1,0,0); });
    }
  } else {
    drawInteriorWalls();
    const F=(kind,u,v,k)=>{ const [X,Y]=iso(u,v); push(k, ()=>put(furnSprite(kind),X,Y)); };
    F('rug',3,5,0); F('bed',1,2,4.99); F('stove',6,2,9.99); F('table',4,4,9.99);
  }
  for (const m of MEMBERS){
    const q = S.pos[m]; if (q.map!==p.map) continue;
    push(charKey(q), ()=>{
      const [X,Y] = charIso(q), step = q.moving ? Math.sin(anim*12) : 0;
      drawCharAt(m,X,Y,q.dir,step);
      if (m==='anh'){ at(X,Y-56*LOOK.anh.s+Math.sin(anim*4)*1.5); poly(ctx,[[-4.5,-4],[4.5,-4],[0,1.5]]); fs(ctx,'#ffd166',1.2); ctx.setTransform(1,0,0,1,0,0); }
      if (q.swing){ const img=TOOLIMG[q.swing.tool]; if (img && img.complete){ const sz=20*Z, sw=Math.sin((0.25-q.swing.t)*22)*.7; ctx.save(); ctx.translate((X-camX+13)*Z,(Y-camY-26)*Z); ctx.rotate(sw); ctx.drawImage(img,-sz/2,-sz/2,sz,sz); ctx.restore(); } }
    });
  }
  list.sort((a,b)=>a.k-b.k).forEach(d=>{ ctx.setTransform(1,0,0,1,0,0); d.fn(); });
  ctx.setTransform(1,0,0,1,0,0);
  const mark=(tx,ty,alpha,dash)=>{ const [X,Y]=iso(tx+.5,ty+.5); at(X,Y); ctx.save(); ctx.scale(.82,.82); diamond(ctx,0); ctx.restore(); ctx.strokeStyle=`rgba(255,255,255,${alpha})`; ctx.lineWidth=1.8; ctx.setLineDash(dash?[3,3]:[]); ctx.stroke(); ctx.setLineDash([]); ctx.setTransform(1,0,0,1,0,0); };
  for (const m of MEMBERS){ const q=S.pos[m]; if (q.map===p.map && q.goal && q.goal.act==='act') mark(q.goal.tx,q.goal.ty, m==='anh'?.85:.45, m!=='anh'); }
  if (marker && marker.map===p.map) mark(marker.tx,marker.ty,Math.max(0,marker.t),false);
  for (const pt of particles){ ctx.globalAlpha=Math.min(1,pt.life*2); ctx.fillStyle=pt.col; ell(ctx,(pt.x-camX)*Z,(pt.y-camY)*Z,2.2*Z,2.2*Z); ctx.fill(); }
  ctx.globalAlpha=1;
  lighting(farm);
  drawBubbles(p);
  ctx.setTransform(1,0,0,1,0,0);
  if (fade>0){ fade=Math.min(1,fade+0.05); ctx.fillStyle=`rgba(20,16,40,${fade})`; ctx.fillRect(0,0,canvas.width,canvas.height); }
}
const TOOLIMG = {};
for (const k of ['scythe','hammer','hoe','can','seed','lua','trung']){ const im=new Image(); im.src=ICON[k]; TOOLIMG[k]=im; }
function frame(now){
  const dt = Math.min(0.05,(now-last)/1000); last = now;
  update(dt);
  if (S && $('title').hidden) drawWorld(); else drawTitleBg();
  requestAnimationFrame(frame);
}
function drawTitleBg(){ ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#5c9842'; ctx.fillRect(0,0,canvas.width,canvas.height); }

// ---- tap: find what is under the finger, front-most first ----
function tapAt(X,Y){
  const p = me(), farm = p.map==='farm';
  for (const m of MEMBERS){ if (m==='anh') continue; const q=S.pos[m]; if (q.map!==p.map) continue;
    const [cx,cy]=charIso(q), s=LOOK[m].s; if (Math.abs(X-cx)<14*s && Y<cy+6 && Y>cy-52*s){ talkTo(m); return; } }
  const th = S.thanh;
  if (farm && th.show && th.map==='farm'){ const [cx,cy]=charIso(th); if (Math.abs(X-cx)<15 && Y<cy+6 && Y>cy-62) return goTo('anh',Math.floor(th.x/TS),Math.floor((th.y-3)/TS),'act'); }
  for (let h=96; h>0; h-=4){
    const [u,v] = isoToTile(X,Y+h), tx=Math.floor(u), ty=Math.floor(v);
    if (farm){
      if (inRect(tx,ty,HOUSE) && h<=90) return orderTile(tx,ty);
      if (inRect(tx,ty,COOP) && h<=48) return orderTile(tx,ty);
      if (tx<0||ty<0||tx>=MW||ty>=MH) continue;
      const i=idx(tx,ty), o=S.o[i], s=S.soil[i];
      const oh = o==='tree'?82 : o==='weed'?18 : o==='rock'?16 : (o==='fenceB'||o==='fence')?20 : o==='bin'?22 : (s&&s.crop&&s.crop.days>=2)?16 : 0;
      if (h<=oh) return orderTile(tx,ty);
    } else {
      if (tx<0||ty<0||tx>=HW||ty>=HH) continue;
      const o=HOUSE_IN.o[idx(tx,ty,HW)], oh = o==='bed'?16 : o==='stove'?26 : o==='table'?14 : 0;
      if (h<=oh) return orderTile(tx,ty);
    }
  }
  const [u,v] = isoToTile(X,Y); orderTile(Math.floor(u),Math.floor(v));
}
function orderTile(tx,ty){
  const map = me().map;
  if (map==='farm'){
    if (inRect(tx,ty,HOUSE)) return goTo('anh', HOUSE.door.x, HOUSE.door.y+1, 'enter', true);
    if (inRect(tx,ty,COOP)) return goTo('anh', COOP.door.x, COOP.door.y, 'act');
    if (autoTool(tx,ty)) return goTo('anh', tx, ty, 'act');
  } else {
    if (ty>=HH-1 || (tx===4 && ty>=HH-2 && !walkable('house',tx,ty))) return goTo('anh', 4, HH-2, 'exit', true);
    if (tx>=0 && ty>=0 && tx<HW && ty<HH){ const o = HOUSE_IN.o[idx(tx,ty,HW)]; if (o==='bed'||o==='stove'||o==='table') return goTo('anh', tx, ty, 'act'); }
  }
  if (walkable(map,tx,ty)) goTo('anh', tx, ty, null, true);
}
canvas.addEventListener('pointerdown', e=>{
  if (!S || paused || !$('title').hidden) return;
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  tapAt((e.clientX-r.left)*(canvas.width/r.width)/Z + camX, (e.clientY-r.top)*(canvas.height/r.height)/Z + camY);
});
canvas.addEventListener('contextmenu', e=>e.preventDefault());

// periodic HUD refresh + safety save when the tab is hidden
setInterval(()=>{ if (S && !paused){ renderFamily(); renderQuest(); checkQuest(); } }, 1000);
document.addEventListener('visibilitychange', ()=>{ if (document.hidden && S && $('title').hidden) saveGame(true); });
window.addEventListener('pagehide', ()=>{ if (S && $('title').hidden) saveGame(true); });

resize(); showTitle(); requestAnimationFrame(frame);
})();
